{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CampusGuide | Reset Password</title>

<link rel="stylesheet" href="{% static 'css/login.css' %}">

<style>
.reset-box{
width:360px;
padding:35px;
background:#fff;
border-radius:14px;
box-shadow:0 15px 40px rgba(0,0,0,.15);
text-align:center;
}

.reset-box h2{
margin-bottom:20px;
}

.reset-box input{
width:100%;
padding:14px;
margin:12px 0;
border:1.5px solid #ccc;
border-radius:10px;
font-size:14px;
}

.reset-box input:focus{
border-color:#1976d2;
outline:none;
box-shadow:0 0 6px rgba(25,118,210,.4);
}

.reset-box button{
width:100%;
padding:14px;
background:#1976d2;
color:white;
border:none;
border-radius:10px;
font-size:15px;
cursor:pointer;
margin-top:10px;
}

.reset-box button:hover{
background:#145ca8;
}

.error{
color:red;
font-size:14px;
margin-top:10px;
}
</style>

</head>

<body>

<div class="header">
<img src="{% static 'images/logo.jpg' %}">
<span class="title">Campus<span>Guide</span></span>
</div>

<div class="container">

<div class="reset-box">

<h2>Reset Password</h2>

<form method="post">
{% csrf_token %}

<input type="password" name="new_password1" placeholder="New Password" required>

<input type="password" name="new_password2" placeholder="Confirm Password" required>

<button type="submit">Reset Password</button>

{% if error %}
<div class="error">{{ error }}</div>
{% endif %}

</form>

</div>

</div>

</body>
</html>
